services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: manytools
      POSTGRES_PASSWORD: manytools
      POSTGRES_DB: manytools
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manytools -d manytools"]
      interval: 3s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://manytools:manytools@db:5432/manytools
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    ports:
      - "3001:3000"
    depends_on:
      - api

volumes:
  pgdata:
